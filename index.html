<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOOM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    iframe, canvas, #dosbox {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain; /* Keeps 4:3 aspect ratio perfectly centered */
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://js-dos.com/games/doom.exe.html" 
    allow="autoplay; fullscreen; keyboard"
    scrolling="no">
  </iframe>
</body>
</html>
