<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caipirinha Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        /* The Video Background */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: none; /* Hidden until button is clicked */
        }

        /* Click Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        h1 {
            color: white;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startParty()">
        <h1>CLICK TO PARTY</h1>
    </div>

    <video loop id="bg-video">
        <source src="caipirinha.mp4" type="video/mp4">
    </video>

    <script>
        function startParty() {
            const video = document.getElementById('bg-video');
            const overlay = document.getElementById('overlay');
            
            // Show video, hide overlay
            video.style.display = 'block';
            overlay.style.display = 'none';
            
            // Play with sound
            video.play();
        }
    </script>

</body>
</html>
