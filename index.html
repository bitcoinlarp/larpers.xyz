<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caipirinha Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrolling */
            background-color: black;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover; /* This makes it behave like a background-size: cover */
        }

        /* Overlay text or UI if you want it */
        .content {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            pointer-events: none; /* Keeps the video clickable if needed */
        }
    </style>
</head>
<body>

    <video autoplay loop id="bg-video">
        <source src="caipirinha.mp4" type="video/mp4">
    </video>

    <div class="content">
        <h1>CAIPIRINHA!</h1>
    </div>

</body>
</html>
